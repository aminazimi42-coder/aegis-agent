name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install package (dev)
        run: |
          if command -v uv >/dev/null 2>&1 && [ -f uv.lock ]; then
            uv sync --frozen --extra dev
          else
            python -m pip install --upgrade pip
            pip install -e ".[dev]"
          fi

      - name: Print environment and collect
        run: |
          python --version
          python -m pytest --collect-only -q | tail -20

      - name: Ruff check
        run: |
          python -m ruff check .

      - name: Pytest
        run: |
          python -m pytest -q
