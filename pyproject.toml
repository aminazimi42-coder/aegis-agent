[build-system]
requires = ["setuptools>=68", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-agent-platform"
version = "0.6.0-a"
description = "Foundation multi-agent SaaS framework for enterprise orchestration"
authors = [ { name = "Amin Azimi" } ]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "mypy>=1.10",
  "ruff>=0.5",
  "bandit>=1.7",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true

[tool.setuptools]
packages = [
  "agents",
  "agents.alina",
  "agents.aylin",
  "agents.bita",
  "agents.kian",
  "agents.ahmad",
  "agents.amin",
  "app",
  "app.api",
  "app.services",
  "core",
  "core.monitoring",
  "core.diagnostics",
  "core.recovery",
  "core.runtime",
]
