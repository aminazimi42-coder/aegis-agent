version: '3.8'
services:
  aegis-agent:
    image: python:3.11-slim
    working_dir: /work
    volumes:
      - ./:/work
    command: bash -c "pip install -r requirements.txt || true && python -m uvicorn app.server:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    restart: unless-stopped
