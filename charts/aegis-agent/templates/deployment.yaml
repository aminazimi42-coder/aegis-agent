apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis-agent.fullname" . | default "aegis-agent" }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: aegis-agent
  template:
    metadata:
      labels:
        app: aegis-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: aegis-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: KMS_MASTER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "aegis-agent.fullname" . }}-kms
                  key: master.key
          resources: {{ toYaml .Values.resources | nindent 10 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
